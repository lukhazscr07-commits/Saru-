<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Minha Galeria</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #ff3366;
            --btn-danger: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        /* --- CABEÇALHO --- */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .logo {
            max-width: 150px;
            max-height: 150px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent-color);
            font-weight: 600;
        }

        /* --- BOTÕES --- */
        .controls-container {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            color: white;
        }

        .upload-btn {
            background-color: var(--accent-color);
        }

        .upload-btn:hover {
            background-color: #e62e5c;
        }

        .clear-btn {
            background-color: transparent;
            border: 2px solid var(--btn-danger);
            color: var(--btn-danger);
        }

        .clear-btn:hover {
            background-color: var(--btn-danger);
            color: white;
        }

        input[type="file"] {
            display: none;
        }

        /* --- GRID DA GALERIA --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .media-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background-color: #000; /* Fundo preto para mídias */
        }

        /* Estilos apenas para imagens */
        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.5s ease;
            cursor: pointer;
        }

        .media-item:hover img {
            transform: scale(1.1);
            filter: brightness(0.7);
        }

        /* Estilos e Player para os vídeos */
        .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preenche todo o quadrado */
            border-radius: 12px;
            outline: none;
        }

        /* --- LIGHTBOX (MODAL APENAS PARA FOTOS AGORA) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <img src="Ativo 11.png" alt="O Meu Logótipo" class="logo" onerror="this.style.display='none'">
        <h1>Minha <span>Galeria</span></h1>
        <p>Fotos e Vídeos</p>
    </header>

    <div class="controls-container">
        <label for="fileInput" class="btn upload-btn">
            + Adicionar Mídias
        </label>
        <input type="file" id="fileInput" multiple accept="image/*,video/*">
        
        <button class="btn clear-btn" onclick="clearGallery()">Limpar Tudo</button>
    </div>

    <main class="gallery" id="galleryContainer"></main>

    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
        </div>
    </div>

    <script>
        const galleryContainer = document.getElementById('galleryContainer');
        const fileInput = document.getElementById('fileInput');
        let db;

        // --- 1. CONFIGURAÇÃO DA BASE DE DADOS DO NAVEGADOR ---
        const request = indexedDB.open("MinhaGaleriaDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("medias")) {
                db.createObjectStore("medias", { autoIncrement: true });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            loadMediaFromDB();
        };

        request.onerror = function(event) {
            console.error("Erro ao abrir a base de dados", event);
            alert("O seu navegador não permite guardar ficheiros localmente.");
        };

        // --- 2. SALVAR NOVOS ARQUIVOS ---
        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            
            const transaction = db.transaction(["medias"], "readwrite");
            const store = transaction.objectStore("medias");

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                store.add(file);
                displayMediaOnScreen(file);
            }
        });

        // --- 3. CARREGAR ARQUIVOS ---
        function loadMediaFromDB() {
            galleryContainer.innerHTML = ''; 
            const transaction = db.transaction(["medias"], "readonly");
            const store = transaction.objectStore("medias");
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = function() {
                const files = getAllRequest.result;
                files.forEach(file => {
                    displayMediaOnScreen(file);
                });
            };
        }

        // --- 4. EXIBIR NA TELA (ATUALIZADO PARA VÍDEOS) ---
        function displayMediaOnScreen(file) {
            const fileURL = URL.createObjectURL(file); 
            const mediaDiv = document.createElement('div');
            mediaDiv.className = 'media-item';

            if (file.type.startsWith('image/')) {
                // Fotos continuam abrindo em tela cheia ao clicar
                mediaDiv.innerHTML = `<img src="${fileURL}" alt="Imagem carregada">`;
                mediaDiv.onclick = () => openModal('image', fileURL);
            } 
            else if (file.type.startsWith('video/')) {
                // Vídeos agora têm o atributo "controls" para mostrar play/pause/volume diretamente
                mediaDiv.innerHTML = `
                    <video src="${fileURL}" controls preload="metadata"></video>
                `;
                // Removemos o clique que abria em tela cheia para não interferir com os botões de controle
            }

            galleryContainer.appendChild(mediaDiv);
        }

        // --- 5. LIMPAR GALERIA ---
        function clearGallery() {
            if (confirm("Tem certeza que deseja apagar toda a galeria? Isso não apagará os ficheiros originais do seu computador.")) {
                const transaction = db.transaction(["medias"], "readwrite");
                const store = transaction.objectStore("medias");
                const clearRequest = store.clear();

                clearRequest.onsuccess = function() {
                    galleryContainer.innerHTML = ''; 
                };
            }
        }

        // --- 6. LIGHTBOX ---
        const modal = document.getElementById("mediaModal");
        const modalBody = document.getElementById("modalBody");

        function openModal(type, url) {
            modal.style.display = "flex";
            modalBody.innerHTML = '';

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'modal-content';
                modalBody.appendChild(img);
            }
        }

        function closeModal() {
            modal.style.display = "none";
            modalBody.innerHTML = ''; 
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal || e.target === modalBody) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                closeModal();
            }
        });
    </script>
</body>
</html>
